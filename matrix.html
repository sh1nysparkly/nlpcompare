<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal Coherence — Permutation Matrix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f9fafb;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --surface-tint: #f1f5f9;
  --border: #e5e7eb;
  --border-soft: #eef2f6;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  --primary: #5048e5;
  --primary-soft: rgba(80, 72, 229, 0.08);
  --primary-strong: #3f37d4;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 8px;
  --r-xl: 12px;
  --shadow-soft: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 12px -6px rgba(15, 23, 42, 0.06);
  --font-display: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-display);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrapper { max-width: 1400px; margin: 0 auto; padding: 24px 28px 60px; }
header { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 24px; }
header h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
header p { margin: 0; color: var(--text-muted); font-size: 13px; }
.controls { display: flex; gap: 16px; align-items: center; margin-bottom: 24px; }
.controls label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.controls select {
  font-family: var(--font-display); font-size: 14px;
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface); color: var(--text); cursor: pointer;
  min-width: 220px;
}
.controls select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.legend { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }
.legend-bar { width: 140px; height: 10px; border-radius: 2px; background: linear-gradient(to right, rgba(80,72,229,0), rgba(80,72,229,0.85)); border: 1px solid var(--border-soft); }
.matrix-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); box-shadow: var(--shadow-soft); overflow: hidden; }
.matrix-scroll { overflow-x: auto; max-height: calc(100vh - 220px); overflow-y: auto; }
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; min-width: max-content; }
.matrix th, .matrix td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
.matrix thead th { background: var(--surface-tint); font-weight: 600; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
.matrix .row-head { background: var(--surface); position: sticky; left: 0; z-index: 1; border-right: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; color: var(--text); max-width: 320px; white-space: nowrap; }
.matrix thead .row-head { z-index: 3; background: var(--surface-tint); }
.matrix .cell { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; text-align: center; min-width: 96px; }
.matrix .cell.empty { color: var(--text-subtle); }
.version-head { min-width: 160px; max-width: 240px; vertical-align: top; padding-top: 12px; padding-bottom: 12px; }
.version-label { display: block; font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--text); text-transform: none; letter-spacing: 0; white-space: normal; word-break: break-word; }
.version-meta { display: block; font-size: 11px; color: var(--text-muted); font-weight: 400; margin-top: 4px; font-family: var(--font-mono); }
.version-pin { display: inline-block; margin-left: 6px; padding: 1px 6px; font-size: 10px; color: var(--primary); background: var(--primary-soft); border-radius: 999px; font-family: var(--font-display); font-weight: 600; letter-spacing: 0.02em; vertical-align: middle; }
.loading, .empty-state { padding: 48px 24px; text-align: center; color: var(--text-muted); }
.error { padding: 12px 16px; background: #fff4f4; color: #8a1f1f; border-radius: var(--r-md); margin-bottom: 16px; font-size: 13px; }
.meta-strip { display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); margin-top: 12px; }
.meta-strip strong { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>Permutation Matrix</h1>
    <p>NLP category confidence across saved permutations &middot; <span style="color: var(--text-subtle);">sibling to the Lab &middot; read-only</span></p>
  </header>
  <div class="controls">
    <label for="slug-select">Page</label>
    <select id="slug-select"></select>
    <div class="legend">
      <span>0.000</span>
      <div class="legend-bar"></div>
      <span>1.000</span>
    </div>
  </div>
  <div id="error-box"></div>
  <div class="matrix-wrap">
    <div class="matrix-scroll" id="matrix-scroll">
      <div class="loading">Loading...</div>
    </div>
  </div>
  <div class="meta-strip" id="meta-strip"></div>
</div>
<script>
const SUPABASE_URL = "https://ghzfrxxevjjfgpxvmahy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdoemZyeHhldmpqZmdweHZtYWh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNzk4OTgsImV4cCI6MjA5Mzc1NTg5OH0.VPJTvdCvU217QmQBjm3ym8ZOoCgyBY-VpLpPdhefa04";

async function postgrest(path) {
  const res = await fetch(SUPABASE_URL + "/rest/v1" + path, {
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    },
  });
  if (!res.ok) throw new Error("Request failed: " + res.status + " " + (await res.text()));
  return await res.json();
}

async function loadSlugs() {
  const rows = await postgrest("/permutations?select=slug");
  return Array.from(new Set(rows.map(r => r.slug))).sort();
}

async function loadPermutations(slug) {
  return await postgrest("/permutations?slug=eq." + encodeURIComponent(slug) + "&order=created_at.asc");
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function cellBg(conf) {
  const a = Math.max(0, Math.min(1, conf)) * 0.85;
  return "rgba(80, 72, 229, " + a.toFixed(3) + ")";
}

function cellTextColor(conf) {
  return conf > 0.5 ? "#ffffff" : "var(--text)";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function showError(msg) {
  document.getElementById("error-box").innerHTML = '<div class="error">' + escapeHtml(msg) + '</div>';
}

function clearError() {
  document.getElementById("error-box").innerHTML = "";
}

function renderMatrix(slug, permutations) {
  const scroll = document.getElementById("matrix-scroll");
  const meta = document.getElementById("meta-strip");
  if (!permutations.length) {
    scroll.innerHTML = '<div class="empty-state">No saved permutations for this page yet.</div>';
    meta.innerHTML = "";
    return;
  }

  const allCats = new Map();
  for (const p of permutations) {
    const cats = (p.nlp_result && p.nlp_result.categories) || [];
    for (const c of cats) {
      const prev = allCats.get(c.name) || 0;
      if (c.confidence > prev) allCats.set(c.name, c.confidence);
    }
  }
  const sortedCats = Array.from(allCats.entries()).sort((a, b) => b[1] - a[1]).map(e => e[0]);

  const lookup = permutations.map(p => {
    const map = new Map();
    const cats = (p.nlp_result && p.nlp_result.categories) || [];
    for (const c of cats) map.set(c.name, c.confidence);
    return map;
  });

  let html = '<table class="matrix"><thead><tr>';
  html += '<th class="row-head">Category</th>';
  for (const p of permutations) {
    const pin = p.is_ux_baseline ? '<span class="version-pin" title="UX baseline (V0.5)">V0.5</span>' : '';
    html += '<th class="version-head"><span class="version-label">' + escapeHtml(p.label) + pin + '</span>';
    html += '<span class="version-meta">' + fmtDate(p.created_at) + '</span></th>';
  }
  html += '</tr></thead><tbody>';

  for (const cat of sortedCats) {
    html += '<tr><th class="row-head">' + escapeHtml(cat) + '</th>';
    for (let i = 0; i < permutations.length; i++) {
      const v = lookup[i].get(cat);
      if (v === undefined || v === null) {
        html += '<td class="cell empty">&mdash;</td>';
      } else {
        const bg = cellBg(v);
        const fg = cellTextColor(v);
        html += '<td class="cell" style="background:' + bg + '; color:' + fg + ';">' + v.toFixed(3) + '</td>';
      }
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  scroll.innerHTML = html;

  const unscored = permutations.filter(p => !p.nlp_result || !p.nlp_result.categories || !p.nlp_result.categories.length).length;
  const baselineCount = permutations.filter(p => p.is_ux_baseline).length;
  meta.innerHTML =
    '<span><strong>' + permutations.length + '</strong> permutations</span>' +
    '<span><strong>' + sortedCats.length + '</strong> distinct categories</span>' +
    (baselineCount ? '<span><strong>' + baselineCount + '</strong> marked as UX baseline</span>' : '') +
    (unscored ? '<span style="color: var(--warning);"><strong>' + unscored + '</strong> not scored</span>' : '');
}

async function init() {
  try {
    const slugs = await loadSlugs();
    const select = document.getElementById("slug-select");
    if (!slugs.length) {
      document.getElementById("matrix-scroll").innerHTML = '<div class="empty-state">No permutations saved in any page yet.</div>';
      return;
    }
    select.innerHTML = slugs.map(s => '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>').join("");
    select.addEventListener("change", async () => {
      clearError();
      document.getElementById("matrix-scroll").innerHTML = '<div class="loading">Loading...</div>';
      try {
        const perms = await loadPermutations(select.value);
        renderMatrix(select.value, perms);
      } catch (e) {
        showError(e.message);
      }
    });
    const perms = await loadPermutations(slugs[0]);
    renderMatrix(slugs[0], perms);
  } catch (e) {
    showError(e.message);
  }
}

init();
</script>
</body>
</html>
